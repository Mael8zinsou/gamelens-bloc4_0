# ============================================================================
# GameLens - Integration continue et deploiement continu (C4.2.3)
# ----------------------------------------------------------------------------
# Le referentiel attend que le pipeline "automatise les taches d'integration et
# de deploiement continu", et le reglement special ajoute la mention DevOps.
# La chaine ne se limite donc pas a executer des tests : elle valide la qualite
# du code, la logique metier, l'infrastructure elle-meme, puis publie une image
# versionnee prete a etre deployee.
#
# Six etages, du moins couteux au plus couteux, pour que l'erreur la plus
# frequente soit aussi la plus rapide a detecter :
#
#   1. qualite      : lint et format, quelques secondes
#   2. tests        : tests unitaires sans infrastructure, quelques secondes
#   3. dag          : construction de l'image Airflow et analyse reelle du DAG
#   4. integration  : socle Docker demarre, pipeline execute de bout en bout
#   5. entrepot     : base Snowflake jetable, schema applique, calcul distribue
#                     verifie, integrite eprouvee en positif et en negatif
#   6. publication  : image poussee sur le registre, uniquement sur la branche
#                     principale et si tout ce qui precede est vert
#
# Les etages 4 et 5 partagent un principe : eprouver le code sur une
# infrastructure reelle creee pour le run et detruite apres, plutot que sur des
# simulacres. Un test qui ne touche jamais le moteur ne dit rien de ce que le
# moteur fait, et Snowflake en est la demonstration : il accepte des donnees
# que son propre schema declare interdites.
# ============================================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:

  qualite:
    name: Qualite du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les outils de qualite
        run: python -m pip install --upgrade pip ruff==0.6.9

      - name: Lint
        run: ruff check ingestion dags tests supervision entrepot

      - name: Format
        run: ruff format --check ingestion dags tests supervision entrepot

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest tests -v --junit-xml=rapport-tests.xml

      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: rapport-tests.xml

  dag:
    name: Integrite du DAG Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Airflow du projet
        run: docker build -t gamelens/airflow:ci ./docker/airflow

      - name: Verifier que les DAG s'analysent sans erreur
        # Analyse le dossier dags avec le vrai moteur Airflow, base de
        # metadonnees SQLite ephemere. Un DAG qui ne s'importe pas, une
        # dependance circulaire ou un provider manquant echouent ici, avant
        # d'atteindre l'ordonnanceur.
        #
        # L'etape reserialize n'est pas decorative : en Airflow 3, `dags list`
        # lit la base de metadonnees et non le dossier. Sans elle, la commande
        # renvoie une liste vide sur une base neuve, et le controle passerait
        # a cote d'un DAG absent.
        #
        # La liste est explicite et non un comptage, pour la raison deja
        # rencontree sur les objets de schema (OBS-32) : une assertion qu'on
        # ajuste a chaque evolution ne teste plus rien, elle enregistre.
        # Ce controle ne visait que gamelens_promotion_gold, ecrit a l'epoque
        # ou il etait le seul DAG, et il n'avait couvert ni la supervision ni
        # l'ingestion temps reel ajoutees depuis.
        env:
          ATTENDUS: >-
            gamelens_promotion_gold
            gamelens_supervision
            gamelens_ingestion_temps_reel
        run: |
            docker run --rm -v "${{ github.workspace }}/dags:/opt/airflow/dags:ro" -e AIRFLOW__CORE__LOAD_EXAMPLES=false -e AIRFLOW__CORE__EXECUTOR=LocalExecutor -e ATTENDUS gamelens/airflow:ci bash -c '
              set -e
              airflow db migrate >/dev/null 2>&1
              airflow dags reserialize >/dev/null 2>&1
              airflow dags list-import-errors 2>/dev/null | tee /tmp/erreurs.txt
              grep -q "No data found" /tmp/erreurs.txt
              echo "PASS: aucune erreur d import"
              airflow dags list 2>/dev/null > /tmp/dags.txt
              for attendu in ${ATTENDUS}; do
                grep -q "${attendu}" /tmp/dags.txt || { echo "ECHEC: ${attendu} absent de la liste"; exit 1; }
                echo "PASS: ${attendu} est enregistre"
              done
            '

  integration:
    name: Integration sur infrastructure reelle
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Demarrer le socle PostgreSQL et Kafka
        # Le meme docker-compose.yml que sur le poste de developpement : c'est
        # l'infrastructure elle-meme qui est testee, pas une approximation.
        run: docker compose up -d postgres kafka

      - name: Attendre que le socle soit sain
        run: |
          for i in $(seq 1 60); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' gamelens-postgres 2>/dev/null || echo absent)
            etat_kafka=$(docker inspect -f '{{.State.Health.Status}}' gamelens-kafka 2>/dev/null || echo absent)
            if [ "$etat" = "healthy" ] && [ "$etat_kafka" = "healthy" ]; then
              echo "socle sain apres ${i} tentative(s)"; exit 0
            fi
            sleep 5
          done
          echo "le socle n a pas demarre a temps"; docker compose logs --tail 50; exit 1

      - name: Verifier l'initialisation des schemas
        # Ce controle comptait auparavant les objets du schema speed, et a
        # casse des que la supervision en a legitimement ajoute : une
        # assertion par comptage se brise a chaque evolution normale, ce qui
        # pousse a l'affaiblir plutot qu'a la lire. Les objets attendus sont
        # donc NOMMES. to_regclass renvoie NULL pour un objet absent, ce qui
        # donne directement la liste de ce qui manque au lieu d'un ecart de
        # comptage a interpreter.
        run: |
          manquants=$(docker exec gamelens-postgres psql -U gamelens_app -d gamelens -tAc "SELECT coalesce(string_agg(o, ', '), '') FROM (VALUES ('speed.game_mapping'), ('speed.player_count_events'), ('speed.price_snapshots'), ('speed.pipeline_runs'), ('speed.alertes'), ('speed.v_daily_player_stats'), ('speed.v_indicateur_fraicheur'), ('speed.v_indicateur_completude'), ('speed.v_indicateur_latence'), ('speed.v_indicateur_fiabilite'), ('speed.v_indicateur_gold'), ('speed.v_supervision_synthese'), ('mart.dim_games'), ('mart.dim_stores'), ('mart.fact_prices'), ('mart.fact_popularity_history'), ('mart.v_popularity_dashboard'), ('bronze.reponses_brutes'), ('bronze.v_sante_sources')) AS attendus(o) WHERE to_regclass(o) IS NULL")
          if [ -n "${manquants}" ]; then
            echo "objets absents apres initialisation : ${manquants}"; exit 1
          fi
          echo "les 19 objets attendus des schemas bronze, speed et mart sont presents"

      - name: Tests de securite sur les roles
        # Ces tests ont besoin d'une base : l'etage `tests` les ignore
        # automatiquement, cet etage-ci les execute. Ils verifient les
        # REFUS autant que les autorisations.
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
        run: python -m pytest tests/test_securite_roles.py -v

      - name: Executer le pipeline temps reel de bout en bout
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          python ingestion/create_topics.py
          python ingestion/seed_game_mapping.py
          python ingestion/steam_producer.py --once
          python ingestion/kafka_to_postgres.py --timeout 20 --depuis-le-debut

      - name: Verifier le resultat en base
        run: |
          lignes=$(docker exec gamelens-postgres psql -U gamelens_app -d gamelens -tAc \
                   "SELECT count(*) FROM speed.player_count_events")
          echo "lignes ecrites : ${lignes}"
          [ "${lignes}" -gt 0 ] || { echo "aucune ligne ecrite"; exit 1; }

      - name: Verifier que la couche Bronze a archive la collecte
        # La couche Bronze n'a d'interet que si elle est alimentee par le
        # chemin normal, sans que personne n'y pense. On verifie donc qu'elle
        # s'est remplie du seul fait d'avoir lance le pipeline, et que le
        # nombre d'archives correspond au nombre de titres suivis : un ecart
        # signalerait un chemin de code qui interroge une source sans archiver.
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
        run: |
          attendu=$(python -c "import json; print(len(json.load(open('config/watchlist.json'))['titres']))")
          archivees=$(docker exec gamelens-postgres psql -U gamelens_app -d gamelens -tAc "SELECT count(*) FROM bronze.reponses_brutes WHERE source = 'steam_player_count'")
          echo "titres suivis : ${attendu} ; reponses archivees : ${archivees}"
          [ "${archivees}" -ge "${attendu}" ] || { echo "la couche Bronze n a pas archive tous les appels"; exit 1; }
          # Une archive qui perd le corps de la reponse ne sert a rien : c'est
          # exactement ce qu'on cherche a conserver.
          avec_charge=$(docker exec gamelens-postgres psql -U gamelens_app -d gamelens -tAc "SELECT count(*) FROM bronze.reponses_brutes WHERE source = 'steam_player_count' AND exploitable AND charge IS NOT NULL")
          echo "archives exploitables portant leur charge : ${avec_charge}"
          [ "${avec_charge}" -ge 1 ] || { echo "aucune reponse exploitable ne porte sa charge"; exit 1; }

      - name: Verifier que le dictionnaire de donnees est a jour
        # Le dictionnaire publie en annexe de la documentation technique est
        # GENERE depuis le catalogue de la base, jamais ecrit a la main. Ce
        # controle regenere et compare : si quelqu'un ajoute une colonne sans
        # regenerer, la chaine vire au rouge.
        #
        # Sans lui, la garantie serait declarative. Une consigne du type "penser
        # a regenerer apres modification du schema" n'est pas un mecanisme,
        # c'est un espoir.
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
        run: python outils/generer_dictionnaire.py --verifier

      - name: Verifier l'idempotence du puits
        # Rejoue les memes messages depuis le debut du topic : la table ne doit
        # pas grossir. C'est le test de recette de la session 1, automatise.
        run: |
          avant=$(docker exec gamelens-postgres psql -U gamelens_app -d gamelens -tAc \
                  "SELECT count(*) FROM speed.player_count_events")
          docker exec gamelens-kafka /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --group gamelens-silver-speed \
            --reset-offsets --to-earliest --topic gamelens.steam.player_count --execute
          POSTGRES_PORT=5433 python ingestion/kafka_to_postgres.py --timeout 20
          apres=$(docker exec gamelens-postgres psql -U gamelens_app -d gamelens -tAc \
                  "SELECT count(*) FROM speed.player_count_events")
          echo "avant rejeu : ${avant}, apres rejeu : ${apres}"
          [ "${avant}" = "${apres}" ] || { echo "REGRESSION : le rejeu a duplique des lignes"; exit 1; }
          echo "idempotence verifiee"

      - name: Verifier le moteur d'alertes
        # Controle de fumee : le moteur doit evaluer ses six regles et
        # alimenter speed.alertes sans erreur, quel que soit l'etat de la
        # plateforme. Des alertes declenchees sont un resultat valide.
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
        run: |
          python supervision/regles_alertes.py
          traces=$(docker exec gamelens-postgres psql -U gamelens_app -d gamelens -tAc "SELECT count(*) FROM speed.pipeline_runs WHERE component = 'moteur_alertes'")
          echo "executions du moteur tracees : ${traces}"
          [ "${traces}" -ge 1 ] || { echo "le moteur d alertes ne s est pas trace (cf. INC-007)"; exit 1; }

      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose logs --tail 100

      - name: Arreter le socle
        if: always()
        run: docker compose down -v

  entrepot:
    name: Recette de l'entrepot Snowflake
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    # L'etage d'integration precedent eprouve la couche Silver speed sur une
    # infrastructure Docker jetable. Celui-ci applique le meme principe a
    # l'entrepot : une base Snowflake est creee pour la duree du run, eprouvee,
    # puis supprimee. La couche de demonstration gamelens n'est jamais visee,
    # et recette_ci.py refuse de demarrer si elle l'etait.
    #
    # Il comble le seul angle mort de la chaine : entrepot/ passait au controle
    # de qualite mais rien ne l'executait, faute d'identifiants sur le runner.
    # C'etait la partie la moins couverte alors qu'elle est la plus exposee,
    # Snowflake n'appliquant pas les contraintes relationnelles.
    #
    # Cout : quelques dizaines de secondes d'entrepot virtuel XS par run, soit
    # de l'ordre de 0,02 credit. Negligeable devant les 400 dollars du compte,
    # mais non nul : c'est la raison du dimensionnement XS et de l'auto-suspend.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Verifier la presence des identifiants
        # Message explicite plutot qu'un echec obscur du connecteur trois
        # minutes plus tard, apres l'installation des dependances.
        env:
          COMPTE: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          CLE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          manquants=""
          [ -n "${COMPTE}" ] || manquants="${manquants} SNOWFLAKE_ACCOUNT"
          [ -n "${CLE}" ] || manquants="${manquants} SNOWFLAKE_PRIVATE_KEY"
          if [ -n "${manquants}" ]; then
            echo "Secrets absents du depot :${manquants}"
            echo "Deposer la cle avec : gh secret set SNOWFLAKE_PRIVATE_KEY < secrets/snowflake_key.p8"
            exit 1
          fi
          echo "identifiants presents"

      - name: Installer l'outillage Snowflake
        # Installe le fichier de dependances reel, dbt compris, et non un
        # sous-ensemble commode. La resolution conjointe de Snowpark et de dbt
        # avait echoue a plusieurs reprises le 20/08/2026 : la refaire a chaque
        # run est en soi un test de non-regression sur l'epinglage.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-snowflake.txt

      - name: Executer la recette sur une base jetable
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: gamelens_wh
          PYTHONPATH: entrepot
        run: python entrepot/recette_ci.py

      - name: Verifier que le dictionnaire de la couche Gold est a jour
        # Lecture seule sur la base de demonstration : ce controle n'ecrit rien
        # et ne cree aucune base. Il compare le dictionnaire du depot au
        # catalogue reel de gamelens.mart.
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: gamelens_wh
          SNOWFLAKE_DATABASE: gamelens
          SNOWFLAKE_SCHEMA: mart
          PYTHONPATH: entrepot
        run: python outils/generer_dictionnaire.py --cible snowflake --verifier

      - name: Supprimer la base jetable restee en place
        # recette_ci.py supprime deja la base dans son bloc finally. Ce filet ne
        # sert qu'au cas ou le run est annule ou depasse son delai, cas ou le
        # finally n'est jamais atteint et ou la base survivrait au run.
        if: always()
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: gamelens_wh
          PYTHONPATH: entrepot
        continue-on-error: true
        run: python entrepot/recette_ci.py --supprimer-seulement

  publication:
    name: Publication de l'image
    runs-on: ubuntu-latest
    needs: [dag, integration, entrepot]
    # Volet deploiement continu : seule la branche principale publie, et
    # seulement si les quatre etages precedents sont verts. Une branche de
    # travail est integree en continu mais n'est jamais deployee.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normaliser le nom du depot en minuscules
        # github.repository conserve la casse du compte (ici Mael8zinsou), or
        # un nom d'image Docker doit etre entierement en minuscules. Sans cette
        # normalisation, la publication echoue sur invalid reference format.
        run: echo "DEPOT=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: S'authentifier aupres du registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Airflow
        uses: docker/build-push-action@v6
        with:
          context: ./docker/airflow
          push: true
          # Deux etiquettes : latest pour l'usage courant, et le SHA du commit
          # pour qu'un deploiement soit toujours rattachable a une revision
          # precise du depot. Sans la seconde, un retour arriere consisterait a
          # esperer que latest pointe encore sur la bonne image.
          tags: |
            ghcr.io/${{ env.DEPOT }}/airflow:latest
            ghcr.io/${{ env.DEPOT }}/airflow:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Recapitulatif
        run: |
          echo "### Image publiee" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ env.DEPOT }}/airflow:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
