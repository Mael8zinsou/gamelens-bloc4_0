# ============================================================================
# GameLens - socle d'infrastructure local, Bloc 4
# ----------------------------------------------------------------------------
# Ce fichier est lui-meme une piece justificative : il liste les composants
# retenus (C4.1.2) et documente la procedure de demarrage (C4.3.3).
#
# Demarrage :  docker compose up -d
# Etat      :  docker compose ps
# Arret     :  docker compose down        (les volumes sont conserves)
# ============================================================================

name: gamelens

# ============================================================================
# Bloc commun aux composants Airflow (C4.2.2, orchestrateur).
#
# Executeur : LocalExecutor, pas CeleryExecutor. Le compose officiel d'Airflow
# retient Celery, ce qui impose un broker Redis et des conteneurs worker
# supplementaires. Cet appareillage sert la montee en charge horizontale, dont
# un DAG de cinq taches sur un poste unique n'a aucun usage. LocalExecutor
# execute les taches en sous-processus paralleles, ce qui suffit ici et divise
# par deux le nombre de conteneurs. Choix assume, a defendre comme un
# dimensionnement et non comme une simplification.
#
# Les connexions sont declarees par variable d'environnement
# (AIRFLOW_CONN_*) et non creees a la main dans l'interface : l'orchestrateur
# se reconstruit entierement depuis le depot, sans etape manuelle.
# ============================================================================
x-airflow-commun: &airflow-commun
  build:
    context: ./docker/airflow
  image: gamelens/airflow:3.1.8
  environment: &airflow-commun-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:devlocal_airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-gamelens_jwt_dev_secret}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Connexion vers la couche Silver speed, consommee par les taches du DAG.
    AIRFLOW_CONN_GAMELENS_POSTGRES: postgresql://gamelens_app:devlocal_app@postgres:5432/gamelens
    # Frontiere de configuration : depuis un conteneur, la base se joint par
    # postgres:5432, pas par localhost:5433. Le code d'ingestion est identique
    # dans les deux cas, seule la configuration change.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_DB: gamelens
    POSTGRES_USER: gamelens_app
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlocal_app}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    PYTHONPATH: /opt/gamelens/ingestion:/opt/gamelens/supervision:/opt/gamelens/entrepot
    GAMELENS_ROOT: /opt/gamelens
    # ------------------------------------------------------------------------
    # Acces a Snowflake depuis l'ordonnanceur, pour le DAG de promotion vers
    # l'entrepot. Ces variables sont les MEMES que celles lues par
    # entrepot/connexion_snowflake.py en ligne de commande : la frontiere de
    # configuration de DA-05 fait que le meme code sert dans les deux cas.
    #
    # Le chemin de la clef est ABSOLU et non celui de .env, qui est relatif au
    # repertoire de travail. Une tache Airflow ne garantit pas lequel c'est.
    #
    # La clef n'entre jamais dans l'image : elle est montee en lecture seule
    # depuis secrets/, ignore par git, exactement comme pour snowflake-cli.
    # ------------------------------------------------------------------------
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
    SNOWFLAKE_PRIVATE_KEY_PATH: /opt/gamelens/secrets/snowflake_key.p8
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-gamelens_wh}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-gamelens}
    SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-mart}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./docker/airflow/logs:/opt/airflow/logs
    - ./docker/airflow/config:/opt/airflow/config
    - ./docker/airflow/plugins:/opt/airflow/plugins
    # Le code du projet est monte en lecture seule : les taches reutilisent les
    # memes modules que le pipeline temps reel, sans duplication.
    - ./ingestion:/opt/gamelens/ingestion:ro
    - ./supervision:/opt/gamelens/supervision:ro
    - ./config:/opt/gamelens/config:ro
    - ./sql:/opt/gamelens/sql:ro
    # entrepot/ porte la promotion Snowpark, appelee par le DAG de promotion
    # vers l'entrepot. Monte en lecture seule comme le reste du code : la
    # tache reutilise le module du depot, elle n'en heberge pas une copie.
    - ./entrepot:/opt/gamelens/entrepot:ro
    - ./secrets:/opt/gamelens/secrets:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:

  # --------------------------------------------------------------------------
  # PostgreSQL : couche Silver speed de l'architecture Lambda (Bloc 1).
  # Heberge aussi la base de metadonnees d'Airflow, sur une base separee, pour
  # eviter un cinquieme conteneur sur un poste de developpement.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gamelens-postgres
    environment:
      POSTGRES_DB: gamelens
      POSTGRES_USER: gamelens_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlocal_app}
      TZ: UTC
    ports:
      # Port hote 5433 volontairement, pas 5432 : un service PostgreSQL 18 natif
      # tourne deja sur le poste et retient le port 5432. Docker publie alors le
      # port sans erreur visible mais sans effet reel (cf. INC-004). Le port
      # INTERNE reste 5432 : les conteneurs se joignent via postgres:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Les scripts d'initialisation s'executent dans l'ordre alphabetique, au
      # tout premier demarrage du conteneur uniquement. Les trois couches sont
      # ainsi montees sur une machine vierge sans aucune etape manuelle, ce dont
      # l'etage d'integration de la CI depend.
      - ./sql/00_create_airflow_db.sql:/docker-entrypoint-initdb.d/00_create_airflow_db.sql:ro
      - ./sql/schema_silver_speed.sql:/docker-entrypoint-initdb.d/10_schema_silver_speed.sql:ro
      # 15 et non 05 : le schema bronze accorde des droits aux roles
      # etl_service et analyst, qui sont crees par le script Silver.
      - ./sql/schema_bronze.sql:/docker-entrypoint-initdb.d/15_schema_bronze.sql:ro
      - ./sql/schema_gold.sql:/docker-entrypoint-initdb.d/20_schema_gold.sql:ro
      - ./sql/schema_supervision.sql:/docker-entrypoint-initdb.d/30_schema_supervision.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelens_app -d gamelens"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Apache Kafka en mode KRaft (sans ZooKeeper), noeud unique.
  #
  # Choix assume : le Bloc 1 prevoyait Kafka, et CLAUDE.md autorisait une
  # alternative plus legere si Kafka s'averait trop lourd en local. Le mode
  # KRaft, disponible depuis Kafka 3.3, supprime la dependance a ZooKeeper et
  # ramene le cluster a un seul conteneur : l'alternative n'est donc pas
  # necessaire, c'est bien Apache Kafka qui tourne, pas un substitut.
  #
  # Deux listeners distincts, piege classique en local : INTERNAL pour les
  # conteneurs (kafka:29092), EXTERNAL pour les processus du poste hote
  # (localhost:9092). Un listener unique fait echouer l'un des deux cotes.
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: gamelens-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: gamelens-kraft-cluster-01
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Airflow, initialisation. Conteneur ephemere : il migre le schema de la base
  # de metadonnees, cree le compte d'administration, puis sort. Les autres
  # composants attendent sa sortie en succes avant de demarrer.
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-commun
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow
        exec /entrypoint airflow version
    environment:
      <<: *airflow-commun-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    user: "0:0"
    restart: "no"

  # --------------------------------------------------------------------------
  # Airflow, serveur d'API et interface web. En Airflow 3, le composant
  # "webserver" d'Airflow 2 est remplace par api-server, qui sert a la fois
  # l'interface et l'API d'execution utilisee par les taches.
  # --------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-commun
    container_name: gamelens-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Airflow, ordonnanceur. Decide quelles taches sont eligibles et les lance.
  # --------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-commun
    container_name: gamelens-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Airflow, analyseur de DAG. Composant distinct et obligatoire depuis
  # Airflow 3 : l'analyse des fichiers de DAG est isolee de l'ordonnanceur,
  # de sorte qu'un fichier de DAG defectueux ne puisse plus le desstabiliser.
  # --------------------------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-commun
    container_name: gamelens-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Airflow, declencheur asynchrone. Necessaire des qu'une tache est deferrable
  # (certains capteurs le sont par defaut en Airflow 3) : sans lui, la tache
  # resterait suspendue indefiniment sans message d'erreur explicite.
  # --------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-commun
    container_name: gamelens-airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Grafana : visualisation des indicateurs de supervision (C4.3.1).
  #
  # Choix de l'outil, a assumer face a la question « pourquoi pas Prometheus ? ».
  # Prometheus excelle sur des metriques systeme collectees par des exporteurs.
  # Ici, les indicateurs surveilles sont metier et deja calcules dans une base
  # relationnelle : fraicheur, completude, latence de bout en bout, fiabilite
  # par composant. Les reexporter vers Prometheus ajouterait un composant et un
  # format de stockage sans ajouter la moindre information, et rendrait les
  # indicateurs dependants d'un outil au lieu de rester interrogeables en SQL
  # par n'importe quel client.
  #
  # Source de donnees et tableau de bord sont provisionnes depuis le depot :
  # aucune configuration n'est saisie a la main dans l'interface, tout est
  # versionne et rejouable.
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.0
    container_name: gamelens-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Outillage Snowflake : dbt et Snowpark.
  #
  # Service d'outillage, pas de service permanent : il n'est pas demarre par
  # `docker compose up` grace au profil, et s'invoque a la demande.
  #
  #   docker compose run --rm snowflake-cli python entrepot/verifier_connexion.py
  #   docker compose run --rm snowflake-cli dbt debug
  #
  # L'isolation repare un conflit reel constate le 20/08/2026 : Snowpark impose
  # snowflake-connector-python 4.x, que dbt-snowflake 1.8 refusait, et remonte
  # au passage la version de requests epinglee pour l'ingestion. Meme raison
  # qu'Airflow : un jeu de dependances qui entre en conflit s'isole.
  # --------------------------------------------------------------------------
  snowflake-cli:
    build:
      context: .
      dockerfile: docker/snowflake/Dockerfile
    image: gamelens/snowflake-cli:1.0
    profiles: ["outillage"]
    env_file:
      # required: false, car .env n'existe pas sur un poste vierge ni en CI, et
      # son absence ferait echouer la validation du fichier compose entier,
      # y compris pour les services qui ne s'en servent pas.
      - path: .env
        required: false
    environment:
      # Frontiere de configuration : depuis le reseau Docker, la couche Silver
      # se joint par postgres:5432, alors que .env porte les valeurs du poste
      # hote (localhost:5433). Le code est identique, seule la connexion change.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./entrepot:/projet/entrepot:ro
      - ./ingestion:/projet/ingestion:ro
      - ./sql:/projet/sql:ro
      - ./dbt:/projet/dbt
      # outils/ genere le dictionnaire de donnees depuis le catalogue Snowflake.
      # docs/annexes/ est monte en ECRITURE, seul point du projet ou un
      # conteneur ecrit dans le depot : le fichier genere doit atterrir sur le
      # poste pour etre versionne.
      - ./outils:/projet/outils:ro
      - ./docs/annexes:/projet/docs/annexes
      # La cle privee est montee en lecture seule et n'entre jamais dans l'image.
      - ./secrets:/projet/secrets:ro
    working_dir: /projet
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  grafana_data:
